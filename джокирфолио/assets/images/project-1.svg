<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg1)"/>
  <!-- Window frame -->
  <rect x="30" y="30" width="740" height="440" rx="16" fill="rgba(255,255,255,0.7)" stroke="rgba(255,255,255,0.9)" stroke-width="1.5"/>
  <!-- Top bar -->
  <circle cx="55" cy="55" r="6" fill="#f87171"/>
  <circle cx="75" cy="55" r="6" fill="#fbbf24"/>
  <circle cx="95" cy="55" r="6" fill="#34d399"/>
  <rect x="130" y="46" width="280" height="18" rx="9" fill="rgba(255,255,255,0.8)"/>
  <!-- Sidebar -->
  <rect x="45" y="80" width="130" height="370" rx="12" fill="rgba(255,255,255,0.6)"/>
  <rect x="60" y="105" width="100" height="12" rx="6" fill="#818cf8"/>
  <rect x="60" y="135" width="85" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="60" y="160" width="90" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="60" y="185" width="75" height="10" rx="5" fill="#cbd5e1"/>
  <!-- Cards Grid -->
  <rect x="195" y="80" width="170" height="90" rx="12" fill="rgba(255,255,255,0.85)"/>
  <text x="215" y="110" font-family="sans-serif" font-size="12" fill="#64748b">Active Users</text>
  <text x="215" y="145" font-family="sans-serif" font-weight="bold" font-size="24" fill="#1e1b4b">24.8k</text>
  <rect x="385" y="80" width="170" height="90" rx="12" fill="rgba(255,255,255,0.85)"/>
  <text x="405" y="110" font-family="sans-serif" font-size="12" fill="#64748b">Conversion Rate</text>
  <text x="405" y="145" font-family="sans-serif" font-weight="bold" font-size="24" fill="#4338ca">+18.4%</text>
  <rect x="575" y="80" width="170" height="90" rx="12" fill="rgba(255,255,255,0.85)"/>
  <text x="595" y="110" font-family="sans-serif" font-size="12" fill="#64748b">Revenue Pulse</text>
  <text x="595" y="145" font-family="sans-serif" font-weight="bold" font-size="24" fill="#059669">9.2k</text>
  <!-- Main Chart Card -->
  <rect x="195" y="190" width="550" height="260" rx="12" fill="rgba(255,255,255,0.9)"/>
  <text x="220" y="225" font-family="sans-serif" font-weight="bold" font-size="15" fill="#1e293b">Performance Overview</text>
  <!-- Chart path -->
  <path d="M220 380 Q 280 290, 360 320 T 500 250 T 640 280 T 710 230 L 710 400 L 220 400 Z" fill="url(#chartGrad)"/>
  <path d="M220 380 Q 280 290, 360 320 T 500 250 T 640 280 T 710 230" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
</svg>